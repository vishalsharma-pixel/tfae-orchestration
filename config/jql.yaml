# jql.yaml
#
# Every JQL query used anywhere in the pipeline, named and documented.
# No script should construct a JQL string inline — every query lives here,
# and every one MUST interpolate project_key from guardrails.yaml rather
# than hardcoding "TFAE" separately. This is what makes a scope mistake
# (e.g. querying TA by accident) a visible diff in this file, not a typo
# buried in a script.
#
# Placeholders like {project_key} are filled in at runtime from guardrails.yaml.

queries:

  find_agent_eligible_stories:
    description: >
      Stories currently opted into automation — either freshly marked
      "Ready for Agent" (nothing dispatched yet) or already "Agent In
      Progress" (dispatch underway, sibling tasks may still need picking
      up). This — NOT "To Do" project-wide — is the real dispatch queue
      boundary. It's what keeps the conductor from ever touching the
      thousands of other cards that exist in TFAE but were never opted in.
      A story only becomes eligible when a human manually moves it to
      "Ready for Agent" — the conductor never picks that status itself.
    jql: >
      project = {project_key} AND issuetype = Story
      AND status in ("Ready for Agent", "Agent In Progress")

  find_child_tasks_of_story:
    description: >
      All child tasks under one specific story. Used two ways: (1)
      combined with find_agent_eligible_stories to build the actual
      dispatch-eligible task list (see find_undispatched_tasks note below),
      and (2) to compute a story's rollup status each cycle (Manual
      Intervention Needed / PR By Agent / Agent In Progress / Ready for
      Agent — see workflow-map.yaml). {story_key} is filled in per-story
      at runtime, not from guardrails.yaml.
    jql: >
      project = {project_key} AND parent = {story_key}

  find_undispatched_tasks:
    description: >
      Raw candidate tasks in "To Do" project-wide. IMPORTANT: this query
      alone is NOT the dispatch queue — it must be intersected against
      find_agent_eligible_stories's results (by parent) before anything
      here is actually dispatchable. A task in "To Do" whose parent story
      was never moved to "Ready for Agent" must NEVER be dispatched, no
      matter how this query looks in isolation. See
      routines/conductor-routine-prompt.md Step 2 for the two-step lookup
      this feeds into.
    jql: >
      project = {project_key} AND status = "To Do" AND issuetype != Story

  find_dispatched_tasks:
    description: >
      Tasks currently "In Progress" — i.e. a Cursor agent was dispatched and
      we're waiting on it. status-sync polls Cursor for each of these.
    jql: >
      project = {project_key} AND status = "In Progress" AND issuetype != Story

  find_open_stories:
    description: >
      Stories not yet finished — used to check whether any story's tasks
      have all reached "Ready To Test" and are eligible for a manual QA pass.
    jql: >
      project = {project_key} AND issuetype = Story
      AND status not in ("Ready for Production", "LIVE")

  find_stale_in_progress:
    description: >
      In Progress tasks that haven't changed status in longer than
      staleness_timeout_hours (see guardrails.yaml). Used to flag agents that
      may have silently stalled or errored without status-sync noticing.
    jql: >
      project = {project_key} AND status = "In Progress"
      AND updated <= "-{staleness_timeout_hours}h"

  find_kill_switch_status:
    description: >
      Checks whether the kill_switch_label (see guardrails.yaml) is present
      on the pipeline's tracking issue. Run FIRST, every conductor cycle,
      before any other query or action.
    jql: >
      project = {project_key} AND labels = "{kill_switch_label}"

  find_stories_over_qa_cap:
    description: >
      Stories that have hit max_qa_cycles_per_story failed passes, tracked
      via the "QA Cycle Count" custom field (customfield_10320 in TFAE,
      confirmed by querying a real TFAE story — see
      docs/getting-started.md Step "QA Cycle Count setup"). Scoped to Story
      issue type only in Jira's field context, so this field does not exist
      on Tasks/Subtasks. Confirmed working: null/blank on a fresh story.
    jql: >
      project = {project_key} AND issuetype = Story
      AND cf[10320] >= {max_qa_cycles_per_story}
