# workflow-map.yaml
#
# Maps TFAE's actual, real Jira workflow statuses (confirmed by querying
# TFAE directly) onto the conceptual pipeline stages used in the writeup and
# in every script. No new Jira statuses are created for this pipeline — it
# rides entirely on what already exists in TFAE.
#
# If TFAE's workflow ever changes (a status renamed, added, or removed),
# update this file and nothing else needs to change conceptually.

statuses:
  # name: the exact TFAE status name (case-sensitive, must match Jira exactly)
  # pipeline_stage: what this status means in the orchestration pipeline

  - name: Idea
    pipeline_stage: not_yet_queued
    notes: >
      Pre-queue. Tasks/stories here are not yet ready for the pipeline to
      touch — they haven't been reviewed into "To Do" yet.

  - name: To Do
    pipeline_stage: queued
    notes: The conductor's dispatch queue (see jql.yaml find_undispatched_tasks).

  - name: In Progress
    pipeline_stage: dispatched
    notes: >
      A Cursor agent has been created for this task. status-sync polls
      Cursor for tasks in this status.

  - name: Code Review
    pipeline_stage: pr_open
    notes: >
      Cursor's agent finished and opened a PR; status-sync linked it here.
      Sits here until a human reviews it — nothing auto-advances past this.

  - name: Ready To Test
    pipeline_stage: dev_complete
    notes: >
      All of a story's child tasks reaching this status is the signal that
      the story is eligible for a manual QA trigger (see jql.yaml
      find_open_stories + the story-readiness check in conductor logic).

  - name: Testing
    pipeline_stage: qa_in_progress
    notes: >
      Set manually when you trigger a QA pass on a story. Prevents the
      conductor from re-flagging the same story as "ready for QA" while
      you're actively reviewing it.

  - name: Ready for Production
    pipeline_stage: verified
    notes: Manual QA passed. Story is done from this pipeline's perspective.

  - name: On Hold
    pipeline_stage: paused
    notes: >
      Not currently used by any automated query, but reserved — if a task
      or story is manually set to On Hold, no script should pick it up.
      Any new query added later MUST exclude this status explicitly.
      Reserved specifically for "a human chose to pause this" — kept
      distinct from the needs-human-review label below, which means
      "the automation stopped itself" instead.

  - name: LIVE
    pipeline_stage: shipped
    notes: Terminal state, outside this pipeline's concern.

  # --- Automation opt-in and rollup statuses (story level, plus one that
  # also applies at task level) — added once real dispatch was confirmed
  # working end to end. These require adding new statuses to TFAE's Jira
  # workflow (an admin action) — see docs/getting-started.md for the setup
  # steps. Confirm with your Jira admin whether these get added to the
  # existing shared Story/Task workflow, or a separate Story-only workflow
  # within the same scheme — either works, but the shared-workflow route is
  # simpler if Ready for Agent / Agent In Progress / PR By Agent will just
  # never be manually applied to a Task by convention.

  - name: Ready for Agent
    pipeline_stage: agent_eligible
    scope: story_only
    notes: >
      MANUAL entry gate, set by a human — never set by the conductor. This
      is the actual opt-in mechanism that keeps automation from touching
      the whole TFAE backlog: only tasks whose parent story is in this
      status (or "Agent In Progress") are ever considered for dispatch.
      A story sits here once it's fully groomed — every child task written
      clearly enough to pass Step 3's dispatch-readiness check.

  - name: Agent In Progress
    pipeline_stage: agent_dispatching
    scope: story_only
    notes: >
      SYSTEM-set automatically, as soon as the FIRST child task under this
      story gets dispatched (not waiting for all of them). Recomputed
      fresh every cycle as part of the story rollup — see
      "Story status rollup" below. Story stays eligible for its remaining
      undispatched sibling tasks while in this status (see
      find_agent_eligible_stories in jql.yaml).

  - name: Manual Intervention Needed
    pipeline_stage: blocked_needs_human
    scope: story_and_task
    notes: >
      Applies at BOTH levels. At the task level: set when a task can't be
      safely dispatched (Step 3's "too unclear" check), or when a
      dispatched task's Cursor run ends in ERROR/CANCELLED/EXPIRED, or when
      a possible duplicate agent is found and held (see
      routines/conductor-routine-prompt.md). At the story level: set
      automatically whenever ANY child task is in this status — this is
      the top-priority state in the rollup (see below), overriding
      "Agent In Progress" or "PR By Agent" until every flagged child task
      is resolved by a human and moved back to "To Do."
      Distinct from the existing `needs-human-review` label
      (guardrails.yaml) — that label is specifically for a story that hit
      `max_qa_cycles_per_story`; this status is for dispatch/execution
      problems, a different failure mode with a different cause.

  - name: PR By Agent
    pipeline_stage: agent_prs_ready
    scope: story_only
    notes: >
      SYSTEM-set automatically once EVERY child task under the story has
      reached "Code Review" or later (Code Review, Ready To Test, Testing,
      Ready for Production, LIVE — i.e. none remain in To Do, In Progress,
      or Manual Intervention Needed). Signals "every task's code is
      implemented and has a PR open, waiting on your review" — distinct
      from the existing "all children reached Ready To Test" signal
      (docs/getting-started.md Step 6), which means code review is DONE
      and the story is ready for a manual QA pass. PR By Agent is the
      earlier, "review the code" signal; Ready To Test rollup is the later
      "review the working feature" signal.

# --- Story status rollup — recomputed fresh every conductor cycle ---
# Never remembered from a previous cycle's decision; always derived live
# from the current state of all child tasks under the story. Priority
# order (top wins if multiple conditions are true at once):
#   1. Manual Intervention Needed — if ANY child task is in this status
#   2. PR By Agent — else if ALL child tasks are Code Review or later
#   3. Agent In Progress — else if AT LEAST ONE child task has left "To Do"
#   4. Ready for Agent — else (nothing dispatched yet, story unchanged)
# This priority order is deliberate: a single stuck task should never be
# masked by other tasks looking fine — Manual Intervention Needed always
# wins until every flagged child is cleared by a human.

# Bug loop note:
# Bugs found in manual QA are NOT a new status — they're new Subtask issues
# created under the story, landing in "To Do" like any other task. The bug
# loop is just the normal dispatch queue picking up a new subtask; there is
# no separate "Bugs Filed" status to maintain.

# QA cycle tracking (added after initial setup):
# "QA Cycle Count" is a Number custom field (customfield_10320 in TFAE),
# scoped to Story issue type only via its Jira field context. It is NOT a
# status — it's a counter, incremented by hand by 1 each time a manual QA
# pass fails. When it reaches max_qa_cycles_per_story (see guardrails.yaml),
# apply the needs-human-review label instead of continuing to recycle the
# story through dispatch. Confirmed: the field appears on TFAE Stories,
# does not appear on TFAE Tasks/Subtasks, and does not appear on issues in
# other projects (TA, TFHFUNNEL) — verified against TFAE-2.

# Transition triggers (explicit, so a future rename has something to check
# against — see docs/writeup.md "Failure mode 4" discussion):
transition_triggers:
  - from: To Do
    to: In Progress
    trigger: Conductor dispatches a Cursor agent for this task.
  - from: In Progress
    to: Code Review
    trigger: status-sync detects the Cursor agent finished and a PR is open.
  - from: Code Review
    to: Ready To Test
    trigger: >
      The PR is MERGED — not just opened. This is a manual action for now
      (you decide when to merge); status-sync does not auto-merge anything.
  - from: Ready To Test
    to: Testing
    trigger: You manually trigger a QA pass on the story.
  - from: Testing
    to: Ready for Production
    trigger: Manual QA pass succeeds.
  - from: Testing
    to: Testing
    trigger: >
      Manual QA pass fails: increment "QA Cycle Count" by 1, file a bug
      subtask (lands in To Do). Story stays in "Testing" — it does NOT
      bounce back to "Ready To Test". This keeps the story's board position
      stable while the bug subtask gets worked through the normal dispatch
      queue underneath it. Story only leaves "Testing" once QA passes, or
      once it hits max_qa_cycles_per_story and gets the needs-human-review
      label instead (see guardrails.yaml).

  # --- New transitions for the automation opt-in / rollup statuses ---
  - from: [Idea, To Do]
    to: Ready for Agent
    trigger: >
      MANUAL. A human decides a story is fully groomed (every child task
      has clear acceptance criteria) and explicitly opts it into
      automation. The conductor never sets this itself.
  - from: Ready for Agent
    to: Agent In Progress
    trigger: >
      SYSTEM. Fires the moment the first child task under the story gets
      dispatched. Recomputed as part of the story rollup every cycle, not
      a one-time flip — see the "Story status rollup" note above.
  - from: [Agent In Progress, Ready for Agent]
    to: Manual Intervention Needed
    trigger: >
      SYSTEM. Fires when any child task under the story enters Manual
      Intervention Needed (task-level). Top priority in the rollup —
      overrides Agent In Progress or PR By Agent until every flagged task
      is cleared.
  - from: Manual Intervention Needed
    to: Agent In Progress
    trigger: >
      SYSTEM (automatic rollup, not a manual action). Once a human clears
      every flagged child task (moves them back to "To Do" or further
      along), the story rollup naturally recomputes to Agent In Progress
      (or PR By Agent, if that condition is now also met) on the next
      cycle — no separate human action needed on the story itself.
  - from: Agent In Progress
    to: PR By Agent
    trigger: >
      SYSTEM. Fires once every child task under the story has reached
      "Code Review" or later. Recomputed every cycle as part of the
      rollup — see the "Story status rollup" note above.
  - from: [To Do, In Progress]
    to: Manual Intervention Needed
    trigger: >
      TASK-LEVEL. SYSTEM. Fires when: (a) Step 3 judges the task too
      unclear to dispatch safely, (b) a dispatched task's Cursor run ends
      in ERROR/CANCELLED/EXPIRED, or (c) a possible duplicate Cursor agent
      is found and the dispatch is held pending human review.
  - from: Manual Intervention Needed
    to: To Do
    trigger: >
      TASK-LEVEL. MANUAL. A human resolves whatever was unclear or broken
      and moves the task back to "To Do" — the conductor picks it up again
      on a future cycle like any other queued task. The conductor never
      clears this status itself.
